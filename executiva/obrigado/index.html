<!doctype html>
<html lang="pt-BR" data-lp-version="executiva">
<head>

  <meta name="robots" content="noindex">
  <meta name="description" content="Mentoria de inglês com o Método M.O.V.E. para executivos, empresários e profissionais que precisam falar com segurança na reunião, na call e na viagem de trabalho.">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Inglês com a Gavi — mentoria de inglês para profissionais">
  <meta property="og:description" content="Um plano de 12 meses para a sua rotina e a sua área, com o Método M.O.V.E.">
  <!-- TODO: og:image (1200x630) e og:url quando o domínio estiver definido. -->

  <!--
    Marca que o JS rodou. Só então os reveals escondem conteúdo: sem JS, a
    página aparece inteira. Se o reveal.js não carregar em 3s, desiste de
    esconder — a página nunca fica invisível.
  -->
  <script>
    document.documentElement.classList.add('js');
    setTimeout(function () {
      if (!document.documentElement.hasAttribute('data-reveal-ready')) {
        document.documentElement.classList.remove('js');
      }
    }, 3000);
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Uma grotesk, dois pesos apenas. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap">
  <link rel="stylesheet" href="../../assets/css/style.css">

  <!--
    Meta Pixel — só PageView aqui, e só em produção.
    `LeadQualificado` NÃO pertence a esta página: é o sinal de renda qualificada
    usado para otimizar a campanha, e quem dispara é o SDR depois de qualificar.
    O clique do botão tem evento próprio (ClickSDR), em assets/js/sdr.js.

    Fora de produção o pixel não carrega: Deploy Preview, branch deploy e link
    de deploy da Netlify (endereço .netlify.app com "--"), servidor local e
    arquivo aberto do disco. Sem `fbq`, o sdr.js também não manda o ClickSDR, e
    o botão segue para o WhatsApp. Visita e clique de teste não entram no
    dataset. É lista de exclusão, não de permissão: um domínio de produção novo
    liga o pixel sem mexer aqui. Host de teste novo (outro serviço de preview)
    entra na lista, e no teste de tests/apoio/verificacoes.mjs.
  -->
  <script>
    (function () {
      var host = location.hostname;
      var teste = host === '' || host === 'localhost' || host === '[::1]' ||
        /^127\./.test(host) || /--[^.]+\.netlify\.app$/.test(host);
      if (teste) return;

      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '645019308445152');
      fbq('track', 'PageView');
    })();
  </script>

  <!--
    Aplicação enviada: evento próprio, com a versão da página. Nunca
    LeadQualificado (esse é do SDR, depois de qualificar). Fora de produção
    não existe fbq, e nada sai.
  -->
  <script>
    if (typeof window.fbq === 'function') {
      window.fbq('trackCustom', 'AplicacaoEnviada', {
        lp_version: document.documentElement.getAttribute('data-lp-version') || ''
      });
    }
  </script>
</head>
<body>

  <!--
    Destino do formulário da versão executiva (action="/executiva/obrigado/").
    A Netlify recebe o envio e mostra esta página.
  -->
  <main>
    <section class="section final obrigado" aria-labelledby="obrigado-title">
      <div class="wrap final__inner">
        <p class="brand">Inglês com a Gavi</p>
        <svg class="final__icon" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg>
        <h1 class="h2" id="obrigado-title">Aplicação recebida</h1>
        <p class="section__lede">
          A equipe da Bruna recebeu os seus dados e entra em contato pelo WhatsApp
          ou pelo e-mail que você informou.
        </p>
        <p class="section__lede">Se preferir adiantar, chame a equipe agora:</p>

        <a class="btn btn--primary"
           data-sdr
           data-sdr-placement="obrigado"
           href="https://wa.me/5521999100432"
           target="_blank"
           rel="noopener">
          <svg class="btn__icon" aria-hidden="true" focusable="false"><use href="#i-whatsapp"></use></svg>
          <span>Conversar no WhatsApp</span>
        </a>

        <p class="hero__alt"><a href="../">Voltar para a página da mentoria</a></p>
      </div>
    </section>
  </main>

  <script src="../../assets/js/sdr.js" defer></script>
